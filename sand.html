<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sand Button</title>
<style>
  :root {
    --bg: #f3ede3; --ink: #2b241c; --muted: #7b6f60; --card: #fbf8f2; --line: #e3d9c9; --accent: #8a6a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; }
  .card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 40px 40px 44px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 20px 50px -30px rgba(60,40,15,.35); }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -.01em; }
  p { margin: 0 0 26px; color: var(--muted); }
  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  input { flex: 1 1 220px; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: #fff;
    padding: 0 16px; font: inherit; color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sand { height: 52px; padding: 0 28px; border-radius: 14px; border: 0; background: #8f7458; color: #fff;
    font: 700 18px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  .sand:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
  .done { margin-top: 18px; font-size: 14px; color: var(--accent); min-height: 1.5em; }
  .fine { margin: 26px 0 0; font-size: 13px; color: #a69a8a; }
</style>
</head>
<body>
<main>
  <section class="card">
    <p class="eyebrow">Field notes</p>
    <h1>One letter a month about slow design.</h1>
    <p>Essays, sketches and the odd recipe. No tracking pixels, unsubscribe any time.</p>
    <form id="signup">
      <input type="email" required placeholder="you@example.com" aria-label="Email address">
      <button class="sand" type="submit">Subscribe</button>
    </form>
    <div class="done" role="status" aria-live="polite"></div>
    <p class="fine">Try pressing the button, or dragging a finger through it.</p>
  </section>
</main>
<script src="fx/sand.js"></script>
<script>
  const btn = document.querySelector('.sand');
  window.__sandfx = window.ElementalFX.attachSand(btn);
  document.getElementById('signup').addEventListener('submit', e => {
    e.preventDefault();
    const email = e.target.querySelector('input').value;
    document.querySelector('.done').textContent = `Thanks, ${email} is subscribed.`;
  });
</script>
</body>
</html>
