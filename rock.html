  const b = makeBody(all);
  b.kin = true;
  b.x = pill.cx + b.hx; b.y = pill.cy + b.hy;
  bodies.push(b);
  chips.length = 0;
  setPhase('intact');
  resetEl.classList.remove('show');
  dirty = true;
}

function segHit(ax, ay, bx, by, cx, cy, dx, dy){
  const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy;
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-12) return -1;
  const qx = cx - ax, qy = cy - ay;
  const t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? t : -1;
}

// A slab struck from above splits along a few long through-cracks rather than shattering like glass:
// one crack runs right across along the stone's rift, two or three more run out from the blow, and
// a branch or two leave the long crack further out. Each crack wanders at low frequency and jags at
// the grain scale; one that meets another crack stops there. Returns the grain groups between them.
function crackGroups(list, cx, cy){
  const G = GR;
  const hw = rock.w / 2, hh = rock.h / 2, L = Math.max(hw - hh, 0);
  const sdf = (x, y) => Math.hypot(Math.max(Math.abs(x) - L, 0), y) - hh;
  const segs = [];
  const CELL = 12, grid = new Map();
  const cellKey = (i, j) => i * 4096 + j;
  const addSeg = (s) => {
    segs.push(s);
    const i0 = Math.floor(Math.min(s[0], s[2]) / CELL), i1 = Math.floor(Math.max(s[0], s[2]) / CELL);
    const j0 = Math.floor(Math.min(s[1], s[3]) / CELL), j1 = Math.floor(Math.max(s[1], s[3]) / CELL);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++){
      const k = cellKey(i + 2048, j + 2048);
      let a = grid.get(k); if (!a){ a = []; grid.set(k, a); } a.push(s);
    }
  };
  const near = (x0, y0, x1, y1, fn) => {
    const i0 = Math.floor(Math.min(x0, x1) / CELL), i1 = Math.floor(Math.max(x0, x1) / CELL);
    const j0 = Math.floor(Math.min(y0, y1) / CELL), j1 = Math.floor(Math.max(y0, y1) / CELL);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++){
      const a = grid.get(cellKey(i + 2048, j + 2048));
      if (a) for (const s of a) fn(s);
    }
  };
  const walk = (x, y, ang, id, minLen) => {
    const f = rand(0.018, 0.04), ph = rand(0, TAU), amp = rand(0.05, 0.14), sd = rand(0, 1000);
    const step = 3;
    let len = 0;
    for (let guard = 0; guard < 500; guard++){
      const a = ang + amp * Math.sin(len * f + ph) + 0.55 * (vn1(len * 0.16 + sd) - 0.5);
      let nx = x + Math.cos(a) * step, ny = y + Math.sin(a) * step;
      let hit = 2;
      if (len >= minLen) near(x, y, nx, ny, s => { if (s[4] !== id){ const tt = segHit(x, y, nx, ny, s[0], s[1], s[2], s[3]); if (tt >= 0 && tt < hit) hit = tt; } });
      if (hit <= 1){ addSeg([x, y, x + (nx - x) * hit, y + (ny - y) * hit, id]); return len; }
      addSeg([x, y, nx, ny, id]);
      if (sdf(nx, ny) > 2) return len;
      x = nx; y = ny; len += step;
    }
    return len;
  };
  const rift = rand(0, Math.PI);
  let id = 0;
  const main = id++;
  walk(cx, cy, rift + rand(-0.12, 0.12), main, 1e9);
  walk(cx, cy, rift + Math.PI + rand(-0.12, 0.12), main, 1e9);
  const mainSegs = segs.slice();
  const nr = Math.random() < 0.55 ? 2 : 3;
  const side0 = Math.random() < 0.5 ? 1 : -1;
  for (let k = 0; k < nr; k++){
    const side = k % 2 ? -side0 : side0;
    walk(cx, cy, rift + side * (Math.PI / 2 + rand(-0.65, 0.65)), id++, 7);
  }
  const branch = () => {
    // leave the long crack somewhere away from the blow, slanting off to one side
    const far = mainSegs.filter(s => Math.hypot(s[0] - cx, s[1] - cy) > 30 && sdf(s[0], s[1]) < -12);
    if (!far.length) return;
    const s = far[Math.floor(Math.random() * far.length)];
    const dir = Math.atan2(s[3] - s[1], s[2] - s[0]);
    walk(s[0], s[1], dir + (Math.random() < 0.5 ? 1 : -1) * rand(0.8, 1.4), id++, 7);
  };
  const nb = Math.random() < 0.65 ? 2 : 3;
  for (let k = 0; k < nb; k++) branch();

  const minArea = G.s * G.s * 9;
  let groups = null;
  for (let attempt = 0; attempt < 7; attempt++){
    const cut = (g, n) => {
      const ax = G.cx[g], ay = G.cy[g], bx = G.cx[n], by = G.cy[n];
      let hitAny = false;
      near(ax, ay, bx, by, s => { if (!hitAny && segHit(ax, ay, bx, by, s[0], s[1], s[2], s[3]) >= 0) hitAny = true; });
      return hitAny;
    };
    const comp = new Map();
    groups = [];
    for (const g of list){
      if (comp.has(g)) continue;
      const gi = groups.length, grp = [g];
      comp.set(g, gi);
      for (let q = 0; q < grp.length; q++){
        for (const n of G.adj[grp[q]]) if (!comp.has(n) && own[n] === own[g] && !cut(grp[q], n)){ comp.set(n, gi); grp.push(n); }
      }
      groups.push(grp);
    }
    groups = blockyGroups(mergeGroups(groups, comp, minArea, 10));
    let big = groups[0], bigA = 0, tot = 0;
    for (const grp of groups){ let a = 0; for (const g of grp) a += G.area[g]; tot += a; if (a > bigA){ bigA = a; big = grp; } }
    if (groups.length >= 7 && bigA < tot * 0.3) break;
    if (groups.length >= 10) break;
    // split the biggest chunk with a crack through it that runs out to its neighbours
    let mx = 0, my = 0;
    for (const g of big){ mx += G.cx[g] * G.area[g]; my += G.cy[g] * G.area[g]; }
    mx /= bigA; my /= bigA;
    let sx = G.cx[big[0]], sy = G.cy[big[0]], sd = Infinity;
    for (const g of big){ const d = (G.cx[g] - mx) ** 2 + (G.cy[g] - my) ** 2; if (d < sd){ sd = d; sx = G.cx[g]; sy = G.cy[g]; } }
    const a = rift + Math.PI / 2 + rand(-0.7, 0.7), cid = id++;
    walk(sx, sy, a, cid, 0);
    walk(sx, sy, a + Math.PI, cid, 0);
  }
  return groups;
}

// Fold groups smaller than minArea (and then the smallest, while there are more than maxN) into the
// neighbour they share the most boundary with.
function mergeGroups(groups, comp, minArea, maxN){
  const G = GR;
  const areas = groups.map(grp => grp.reduce((s, g) => s + G.area[g], 0));
  const alive = groups.map(() => true), stuck = groups.map(() => false);
  for (let guard = 0; guard < 400; guard++){
    let worst = -1, wa = Infinity, live = 0;
    for (let i = 0; i < groups.length; i++) if (alive[i]){ live++; if (!stuck[i] && areas[i] < wa){ wa = areas[i]; worst = i; } }
    if (worst < 0 || live <= 1 || (wa >= minArea && live <= maxN)) break;
    const counts = new Map();
    for (const g of groups[worst]) for (const nb of G.adj[g]){
      const j = comp.get(nb);
      if (j !== undefined && j !== worst && alive[j]) counts.set(j, (counts.get(j) || 0) + 1);
    }
    let best = -1, bc = 0;
    for (const [j, c] of counts) if (c > bc){ bc = c; best = j; }
    if (best < 0){ stuck[worst] = true; continue; }
    alive[worst] = false;
    for (const g of groups[worst]){ comp.set(g, best); groups[best].push(g); }
    areas[best] += areas[worst]; groups[worst] = [];
  }
  return groups.filter((g, i) => alive[i] && g.length);
}

let breakTiming = null;
function breakIntact(x, y){
  if (phase !== 'intact') return;
  const b = bodies[0];
  const [cx, cy] = toRock(b, x, y);
  const t0 = performance.now();
  const groups = crackGroups(b.grains, cx, cy);
  const t1 = performance.now();
  const [rx, ry] = toRock(b, x, y);
  const kids = splitBody(b, groups, x, y, 230, true);
  breakTiming = [t1 - t0, performance.now() - t1];
  for (const k of kids){ k.kin = false; k.born = simT; }
  setPhase('broken');
  resetEl.classList.add('show');
  lastInput = simT;
  crackSound(1.3);
  spawnChips(x, y, 10, 260, rx, ry);
  spawnDust(x, y, 1.6);
  fractureCount++;
}

function startReassembly(){
  if (phase !== 'broken') return;
  for (const id of [...grabs.keys()]) release(id, true);
  setPhase('reassembling');
  glideT = 0; sealT = 0;
  resetEl.classList.remove('show');
  for (const b of bodies){
    const tx = pill.cx + b.hx, ty = pill.cy + b.hy;
    const a0 = ((b.a % TAU) + TAU + Math.PI) % TAU - Math.PI;
    const dist = Math.hypot(b.x - tx, b.y - ty) + Math.abs(a0) * b.R;
    b.kin = true; b.vx = b.vy = b.w = 0;
    b.glide = { x0: b.x, y0: b.y, a0, tx, ty, delay: rand(0, 0.25) + (dist < 1 ? 0 : 0.05), dur: 0.7 + Math.min(dist / 1000, 0.6),
      lift: dist < 1 ? 0 : 0.6 + 1.4 * Math.random(), landed: dist < 1 };
  }
  for (const b of bodies) buildOutline(b);
  for (const c of chips) c.fade = 1;
  glideSound();
  dirty = true;
}

function updateGlide(dt){
  glideT += dt;
  let all = true, landed = 0;
  for (const b of bodies){
    const g = b.glide;
    const u = clamp((glideT - g.delay) / g.dur, 0, 1);
    const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    b.x = g.x0 + (g.tx - g.x0) * e; b.y = g.y0 + (g.ty - g.y0) * e; b.a = g.a0 * (1 - e);
    b.z = g.lift * Math.sin(Math.PI * u);
    if (u >= 1 && !g.landed){ g.landed = true; landed++; }
    if (u < 1) all = false;
  }
  if (landed && performance.now() - lastKnock > 25){ settleSound(); lastKnock = performance.now(); }
  if (all){
    sealT += dt / 0.5;
    for (const b of bodies) b.seam = Math.max(0, 1 - sealT);
    if (sealT >= 1) finishReassembly();
  }
  dirty = true;
}

function finishReassembly(){
  if (Math.abs(pill.w - rock.w) > 0.5){ buildRock(); sealSound(); return; }
  for (const b of bodies) freeBody(b);
  bodies = [];
  const all = [];
  for (let g = 0; g < GR.n; g++) all.push(g);
  const b = makeBody(all);
  b.kin = true; b.x = pill.cx + b.hx; b.y = pill.cy + b.hy;
  bodies.push(b);
  chips.length = 0;
  setPhase('intact');
  sealSound();
  dirty = true;
}

// ---------------------------------------------------------------- input
function inPill(x, y){
  const hw = pill.w / 2, hh = pill.h / 2, L = Math.max(hw - hh, 0);
  return Math.hypot(Math.max(Math.abs(x - pill.cx) - L, 0), y - pill.cy) < hh;
}
function grab(id, x, y, t){
  if (phase !== 'broken') return false;
  let b = bodyAt(x, y, 10);
  if (!b) return false;
  const c = Math.cos(b.a), s = Math.sin(b.a), dx = x - b.x, dy = y - b.y;
  let lx = c * dx + s * dy, ly = -s * dx + c * dy;
  // a pick from just outside a tiny piece grabs its middle
  if (!bodyContains(b, x, y)){ lx = 0; ly = 0; }
  grabs.set(id, { id, body: b, lx, ly, tx: x, ty: y, ix: 0, iy: 0, px: x, py: y, pt: t, pvx: 0, pvy: 0 });
  b.rest = 0;
  lastInput = simT;
  dirty = true;
  return true;
}
function moveGrab(id, x, y, t){
  const gr = grabs.get(id); if (!gr) return;
  const dt = Math.max((t - gr.pt) / 1000, 1e-3);
  const vx = (x - gr.px) / dt, vy = (y - gr.py) / dt;
  const k = Math.min(1, dt / 0.04);
  gr.pvx += (vx - gr.pvx) * k; gr.pvy += (vy - gr.pvy) * k;
  gr.px = x; gr.py = y; gr.pt = t;
  gr.tx = clamp(x, 0, cssW); gr.ty = clamp(y, 0, cssH);
  gr.body.rest = 0;
  lastInput = simT;
}
function release(id, silent){
  const gr = grabs.get(id); if (!gr) return;
  grabs.delete(id);
  const b = gr.body;
  if (!silent && !b.dead && performance.now() - gr.pt < 60){
    // hand the stone the pointer's last velocity at the grab point, so a flick throws it
    const [rx, ry] = grabPoint(gr);
    const ax = b.vx - b.w * ry, ay = b.vy + b.w * rx;
    const k = 0.85;
    b.vx += (gr.pvx - ax) * k; b.vy += (gr.pvy - ay) * k;
  }
  lastInput = simT;
  canvas.style.cursor = 'default';
}

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  audio();
  const x = e.clientX, y = e.clientY;
  lastInput = simT;
  if (phase === 'intact'){
    if (inPill(x, y)){ breakIntact(x, y); e.preventDefault(); }
    return;
  }
  if (phase === 'broken' && grab(e.pointerId, x, y, performance.now())){
    try { canvas.setPointerCapture(e.pointerId); } catch {}
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  }
});
canvas.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (grabs.has(e.pointerId)){ moveGrab(e.pointerId, x, y, performance.now()); return; }
  if (e.pointerType === 'mouse' && !grabs.size){
    canvas.style.cursor = phase === 'intact' ? (inPill(x, y) ? 'pointer' : 'default')
      : phase === 'broken' && bodyAt(x, y, 4) ? 'grab' : 'default';
  }
});
canvas.addEventListener('pointerup', e => release(e.pointerId, false));
canvas.addEventListener('pointercancel', e => release(e.pointerId, true));
canvas.addEventListener('lostpointercapture', e => release(e.pointerId, false));
window.addEventListener('blur', () => { for (const id of [...grabs.keys()]) release(id, true); });
btnEl.addEventListener('click', () => {
  audio();
  if (phase === 'intact') breakIntact(pill.cx + rand(-0.15, 0.15) * pill.w, pill.cy + rand(-0.15, 0.15) * pill.h);
  else if (phase === 'broken') startReassembly();
});
resetEl.addEventListener('click', () => { audio(); startReassembly(); });
window.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey){ lastInput = simT; startReassembly(); }
});

// ---------------------------------------------------------------- frame
let acc = 0;
function update(dt){
  simT += dt;
  if (phase === 'broken'){
    acc += dt;
    let n = 0;
    let vmax = 0;
    for (const b of bodies) if (!b.kin){ const v = Math.hypot(b.vx, b.vy) + Math.abs(b.w) * b.R; if (v > vmax) vmax = v; }
    findDeepPairs();
    const div = clamp(Math.ceil(vmax * H_STEP / 3), 1, 3), h = H_STEP / div;
    ({ contact: contactSoft, wall: wallSoft, drag: dragSoft } = SOFTS[div - 1]);
    curH = h;
    while (acc >= h - 1e-9 && n < MAX_SUBSTEPS * div){ physicsStep(h); acc -= h; n++; }
    if (n === MAX_SUBSTEPS * div) acc = 0;
    // sound for this frame
    if (knocks.length){
      knocks.sort((p, q) => q.v * Math.sqrt(q.m) - p.v * Math.sqrt(p.m));
      const now = performance.now();
      let played = 0;
      for (const k of knocks){
        if (played >= 2 || now - lastKnock < 28) break;
        knockSound(k.v, k.m, k.wall); played++; lastKnock = now;
      }
      knocks.length = 0;
    }
    let lvl = 0, bright = 0;
    for (const gr of grabs.values()){
      const sp = Math.hypot(gr.body.vx, gr.body.vy) + Math.abs(gr.body.w) * gr.body.R * 0.5;
      lvl += clamp(sp / 700, 0, 1) * clamp(Math.sqrt(gr.body.area) / 60, 0.35, 1.2);
      bright = Math.max(bright, clamp(sp / 900, 0, 1));
    }
    scrapeLevel(0.22 * Math.min(lvl, 1.4), bright);
    if (!grabs.size && simT - lastInput > IDLE_RESET && bodies.every(b => Math.hypot(b.vx, b.vy) + Math.abs(b.w) * b.R < 8)) startReassembly();
  } else if (phase === 'reassembling'){
    updateGlide(dt);
    scrapeLevel(0, 0);
  }
  if (phase === 'intact' && scrapeN) scrapeLevel(0, 0);
  updateParticles(dt);
}
function needsRender(){
  if (dirty || grabs.size || phase === 'reassembling' || dust.length) return true;
  for (const c of chips) if (!c.rest || c.fade !== undefined) return true;
  for (const b of bodies) if (!b.kin && (b.vx !== 0 || b.vy !== 0 || b.w !== 0)) return true;
  return false;
}

// ---------------------------------------------------------------- render
let skipPass = 0;
function render(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, gFb);
  gl.viewport(0, 0, W, H);
  gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, -1]);
  gl.clearBufferfv(gl.COLOR, 1, [0, 0, 1000, 0]);
  gl.clearBufferfv(gl.COLOR, 2, [0, 0, 0, 0]);
  gl.clearBufferfv(gl.DEPTH, 0, [1]);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);

  const nb = bodies.length;
  const d = fillInst(pieceInst, nb);
  bodies.forEach((b, i) => {
    const o = i * 16;
    d[o] = b.x; d[o + 1] = b.y; d[o + 2] = b.a; d[o + 3] = b.z;
    d[o + 4] = b.box[0]; d[o + 5] = b.box[1]; d[o + 6] = b.box[2]; d[o + 7] = b.box[3];
    d[o + 8] = b.row; d[o + 9] = b.nO; d[o + 10] = b.nT; d[o + 11] = b.seam;
    d[o + 12] = b.hx; d[o + 13] = b.hy; d[o + 14] = b.id % 4000000; d[o + 15] = b.T;
  });
  const pp = P.piece;
  gl.useProgram(pp.p);
  gl.uniform2f(pp.u.uCss, cssW, cssH);
  gl.uniform1f(pp.u.uLean, LEAN);
  gl.uniform1f(pp.u.uDpr, dpr);
  bindTex(0, segTex); gl.uniform1i(pp.u.uSegs, 0);
  bindTex(1, textTex); gl.uniform1i(pp.u.uText, 1);
  gl.uniform4f(pp.u.uTextBox, -rock.w / 2, -rock.h / 2, rock.w, rock.h);
  gl.bindVertexArray(pieceInst.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, pieceInst.buf);
  gl.bufferData(gl.ARRAY_BUFFER, d.subarray(0, nb * 16), gl.DYNAMIC_DRAW);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nb);

  if (chips.length){
    const cd = fillInst(chipInst, chips.length);
    chips.forEach((c, i) => {
      const o = i * 12;
      cd[o] = c.x; cd[o + 1] = c.y; cd[o + 2] = c.z; cd[o + 3] = c.a;
      cd[o + 4] = c.size; cd[o + 5] = c.seed; cd[o + 6] = c.id % 40000; cd[o + 7] = 0;
      cd[o + 8] = c.ox; cd[o + 9] = c.oy; cd[o + 10] = 0; cd[o + 11] = 0;
    });
    gl.useProgram(P.chip.p);
    gl.uniform2f(P.chip.u.uCss, cssW, cssH);
    gl.bindVertexArray(chipInst.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, chipInst.buf);
    gl.bufferData(gl.ARRAY_BUFFER, cd.subarray(0, chips.length * 12), gl.DYNAMIC_DRAW);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, chips.length);
  }
  gl.disable(gl.DEPTH_TEST);

  bindTex(0, g2Tex);
  if (!(skipPass & 1)) gl.generateMipmap(gl.TEXTURE_2D);

  gl.bindFramebuffer(gl.FRAMEBUFFER, shFb);
  gl.viewport(0, 0, W, H);
  // the shadow march only runs where stone or its shadow can be: the pieces' boxes, stretched away
  // from the sun by the longest shadow and padded by the occlusion radius
  gl.clearBufferfv(gl.COLOR, 0, [1, 1, 0, 1]);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const b of bodies){ const r = b.R + 2; x0 = Math.min(x0, b.x - r); y0 = Math.min(y0, b.y - r); x1 = Math.max(x1, b.x + r); y1 = Math.max(y1, b.y + r); }
  for (const c of chips){ x0 = Math.min(x0, c.x - 4); y0 = Math.min(y0, c.y - 4); x1 = Math.max(x1, c.x + 4); y1 = Math.max(y1, c.y + 4); }
  const lh = Math.hypot(LIGHT[0], LIGHT[1]), shLen = (SLAB + 16) * lh / LIGHT[2];
  const sx = -LIGHT[0] / lh * shLen, sy = -LIGHT[1] / lh * shLen, pad = 22;
  x0 = Math.min(x0, x0 + sx) - pad; x1 = Math.max(x1, x1 + sx) + pad;
  y0 = Math.min(y0, y0 + sy) - pad; y1 = Math.max(y1, y1 + sy) + pad;
  const sc = [Math.max(0, Math.floor(x0 * dpr)), Math.max(0, Math.floor((cssH - y1) * dpr)), 0, 0];
  sc[2] = Math.min(W, Math.ceil(x1 * dpr)) - sc[0]; sc[3] = Math.min(H, Math.ceil((cssH - y0) * dpr)) - sc[1];
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(sc[0], sc[1], Math.max(sc[2], 0), Math.max(sc[3], 0));
  gl.useProgram(P.shadow.p);
  gl.uniform1i(P.shadow.u.uH, 0);
  gl.uniform2f(P.shadow.u.uSize, W, H);
  gl.uniform1f(P.shadow.u.uDpr, dpr);
  gl.uniform3f(P.shadow.u.uL, ...LIGHT);
  let top = SLAB;
  for (const b of bodies) if (b.T + b.z > top) top = b.T + b.z;
  for (const c of chips) if (c.z + c.size > top) top = c.z + c.size;
  gl.uniform1f(P.shadow.u.uTop, top + 1);
  gl.bindVertexArray(emptyVao);
  if (!(skipPass & 2) && sc[2] > 0 && sc[3] > 0) gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.SCISSOR_TEST);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  const c = P.comp;
  gl.useProgram(c.p);
  bindTex(0, g0Tex); gl.uniform1i(c.u.uG0, 0);
  bindTex(1, g1Tex); gl.uniform1i(c.u.uG1, 1);
  bindTex(2, g2Tex); gl.uniform1i(c.u.uG2, 2);
  bindTex(3, gaTex); gl.uniform1i(c.u.uGA, 3);
  bindTex(4, gnTex); gl.uniform1i(c.u.uGN, 4);
  bindTex(5, shTex); gl.uniform1i(c.u.uSh, 5);
  bindTex(6, stoneTex); gl.uniform1i(c.u.uStone, 6);
  bindTex(7, stoneMTex); gl.uniform1i(c.u.uStoneM, 7);
  gl.uniform4f(c.u.uStoneBox, ...stoneBox);
  gl.uniform2f(c.u.uCss, cssW, cssH);
  gl.uniform1f(c.u.uDpr, dpr);
  gl.uniform3f(c.u.uL, ...LIGHT);
  if (!(skipPass & 4)) gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (dust.length){
    const dd = fillInst(dustInst, dust.length);
    dust.forEach((p, i) => {
      const t = p.age / p.life;
      dd[i * 4] = p.x; dd[i * 4 + 1] = p.y; dd[i * 4 + 2] = p.r;
      dd[i * 4 + 3] = p.a0 * Math.pow(1 - t, 1.6) * Math.min(1, p.age / 0.05);
    });
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(P.dust.p);
    gl.uniform2f(P.dust.u.uCss, cssW, cssH);
    gl.bindVertexArray(dustInst.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, dustInst.buf);
    gl.bufferData(gl.ARRAY_BUFFER, dd.subarray(0, dust.length * 4), gl.DYNAMIC_DRAW);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, dust.length);
    gl.disable(gl.BLEND);
  }
  gl.bindVertexArray(null);
  dirty = false;
}

function bakeGround(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, groundFb);
  gl.viewport(0, 0, W, H);
  gl.useProgram(P.ground.p);
  gl.uniform1f(P.ground.u.uDpr, dpr);
  gl.uniform1f(P.ground.u.uDevH, H);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function bakeStone(){
  const key = rock.w + ':' + rock.h + ':' + dpr;
  if (key === stoneKey) return;
  stoneKey = key;
  const M = 8, texel = 1 / dpr;
  const tw = Math.ceil((rock.w + 2 * M) * dpr), th = Math.ceil((rock.h + 2 * M) * dpr);
  [stoneTex, stoneMTex].forEach(t => t && gl.deleteTexture(t));
  if (stoneFb) gl.deleteFramebuffer(stoneFb);
  stoneTex = makeTex(tw, th, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
  stoneMTex = makeTex(tw, th, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
  stoneFb = makeTarget([stoneTex, stoneMTex]);
  const ox = -rock.w / 2 - M, oy = -rock.h / 2 - M;
  stoneBox = [ox, oy, tw * texel, th * texel];
  gl.bindFramebuffer(gl.FRAMEBUFFER, stoneFb);
  gl.viewport(0, 0, tw, th);
  gl.useProgram(P.stone.p);
  gl.uniform2f(P.stone.u.uOrg, ox, oy);
  gl.uniform1f(P.stone.u.uTexel, texel);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function layout(){
  const w = Math.max(120, Math.min(270, cssW * 0.64, cssH * 0.5 / 0.63));
  pill.w = w; pill.h = w * 0.63;
  pill.cx = cssW / 2; pill.cy = cssH * 0.45;
  const s = btnEl.style;
  s.left = (pill.cx - pill.w / 2) + 'px'; s.top = (pill.cy - pill.h / 2) + 'px';
  s.width = pill.w + 'px'; s.height = pill.h + 'px';
}

function resize(){
  if (lost || gl.isContextLost()) return;
  cssW = Math.max(1, window.innerWidth); cssH = Math.max(1, window.innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const maxPx = 8.3e6;
  if (cssW * cssH * dpr * dpr > maxPx) dpr = Math.sqrt(maxPx / (cssW * cssH));
  canvas.width = Math.max(1, Math.round(cssW * dpr)); canvas.height = Math.max(1, Math.round(cssH * dpr));
  W = gl.drawingBufferWidth; H = gl.drawingBufferHeight;
  dpr = W / cssW;

  [g0Tex, g1Tex, g2Tex, shTex, gaTex, gnTex].forEach(t => t && gl.deleteTexture(t));
  [gFb, shFb, groundFb].forEach(f => f && gl.deleteFramebuffer(f));
  if (depthRb) gl.deleteRenderbuffer(depthRb);
  g0Tex = makeTex(W, H, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST);
  g1Tex = makeTex(W, H, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.NEAREST);
  depthRb = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, depthRb);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H);
  g2Tex = makeTex(W, H, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR, Math.floor(Math.log2(Math.max(W, H))) + 1);
  gFb = makeTarget([g0Tex, g1Tex, g2Tex], depthRb);
  shTex = makeTex(W, H, gl.RG8, gl.RG, gl.UNSIGNED_BYTE, gl.NEAREST);
  shFb = makeTarget([shTex]);
  gaTex = makeTex(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
  gnTex = makeTex(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
  groundFb = makeTarget([gaTex, gnTex]);
  bakeGround();

  const ox = pill.cx, oy = pill.cy, ow = prevW || cssW, oh = prevH || cssH;
  prevW = cssW; prevH = cssH;
  layout();
  if (!GR || (phase === 'intact' && Math.abs(pill.w - rock.w) > 0.5)) buildRock();
  else {
    const mx = pill.cx - ox, my = pill.cy - oy;
    for (const b of bodies){
      if (phase === 'intact'){ b.x = pill.cx + b.hx; b.y = pill.cy + b.hy; continue; }
      if (phase === 'reassembling'){ b.glide.tx += mx; b.glide.ty += my; b.glide.x0 += mx; b.glide.y0 += my; }
      if (phase === 'broken'){ b.x *= cssW / ow; b.y *= cssH / oh; }
      const r = Math.min(b.R * 0.6, Math.min(cssW, cssH) * 0.45);
      b.x = clamp(b.x, r, Math.max(r, cssW - r)); b.y = clamp(b.y, r, Math.max(r, cssH - r));
      b.wv = false; b.rest = 0;
    }
  }
  measureControls();
  if (phase === 'broken') relaxPile(40);
  bakeStone();
  settleUntil = simT + 0.6;
  dirty = true;
  render();
}

// After the viewport jumps, the pile is squeezed or stretched along with it; walk the pieces apart
// by position alone (no velocity), so nothing is flung. What the time budget leaves is cleared by
// the per-step pass over the next frames.
function relaxPile(budgetMs){
  const t0 = performance.now();
  for (const b of bodies){ b.rest = 0; b.wv = false; }
  for (let it = 0; it < 200 && performance.now() - t0 < budgetMs; it++){
    dyn.length = 0;
    for (const b of bodies) if (!b.kin) dyn.push(b);
    findDeepPairs();
    collide(0);
    const left = pushApart(0.2, 2, 4);
    for (const b of dyn){ b.dx = b.dy = b.da = 0; }
    if (!left) break;
  }
  nContacts = 0;
}

let last = performance.now(), manual = false;
const cpuLog = [];            // [update ms, render-submit ms] for recent frames
let gpuQueries = null;
function frameStep(dt){
  const t0 = performance.now();
  update(dt);
  const t1 = performance.now();
  let t2 = t1;
  if (needsRender()){ timedRender(); t2 = performance.now(); }
  cpuLog.push([t1 - t0, t2 - t1, bodies.length]);
  if (cpuLog.length > 240) cpuLog.shift();
}
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
function timedRender(){
  if (!gpuQueries || !timerExt){ render(); return; }
  const q = gl.createQuery();
  gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q);
  render();
  gl.endQuery(timerExt.TIME_ELAPSED_EXT);
  gpuQueries.pending.push(q);
}
function pollGpu(){
  if (!gpuQueries) return;
  const p = gpuQueries.pending;
  while (p.length && gl.getQueryParameter(p[0], gl.QUERY_RESULT_AVAILABLE)){
    const q = p.shift();
    if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) gpuQueries.ms.push(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6);
    gl.deleteQuery(q);
  }
}
function frame(now){
  pollGpu();
  if (!manual && !lost) frameStep(Math.min((now - last) / 1000, 1 / 20));
  last = now;
  requestAnimationFrame(frame);
}

let resizeQueued = false;
function queueResize(){
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; resize(); });
}
window.addEventListener('resize', queueResize);
(function watchDpr(){
  const mq = matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
  mq.addEventListener('change', () => { queueResize(); watchDpr(); }, { once: true });
})();

resize();
requestAnimationFrame(frame);

// hooks for automated testing
window.__rock = {
  manual(on){ manual = on; last = performance.now(); },
  advance(sec, fps = 60){
    const n = Math.round(sec * fps);
    for (let i = 0; i < n; i++) update(1 / fps);
    render();
  },
  get state(){
    return { phase, pieces: bodies.length, chips: chips.length, dust: dust.length, grabs: grabs.size, fractures: fractureCount,
      contacts: nContacts, maxPen, maxDeep, deepPairs: deepPairs.size, idle: simT - lastInput, grains: GR ? GR.n : 0 };
  },
  get pieces(){
    return bodies.map(b => ({ id: b.id, x: b.x, y: b.y, angle: b.a, vx: b.vx, vy: b.vy, w: b.w, area: b.area, grains: b.grains.length, R: b.R, z: b.z, segs: b.nT, orig: b.nO }));
  },
  get pill(){ return { ...pill }; },
  breakAt(x, y){ breakIntact(x, y); },
  reset(){ lastInput = simT; startReassembly(); },
  // synthetic pointer: grab / move / release by id, in CSS px
  grab(id, x, y){ return grab(id, x, y, performance.now()); },
  move(id, x, y, tMs){ moveGrab(id, x, y, tMs ?? performance.now()); },
  release(id){ release(id, false); },
  setVelocity(id, vx, vy, w = 0){ const b = bodies.find(q => q.id === id); if (b){ b.vx = vx; b.vy = vy; b.w = w; b.rest = 0; lastInput = simT; } },
  place(id, x, y, a = 0){ const b = bodies.find(q => q.id === id); if (b){ b.x = x; b.y = y; b.a = a; b.wv = false; b.rest = 0; } },
  resetPen(){ maxPen = 0; maxDeep = 0; penInfo = null; },
  // tests: keep only these pieces in play (others are parked off-stage as kinematic)
  isolate(ids){ for (const b of bodies){ const k = !ids.includes(b.id); b.kin = k; if (k){ b.x = -5000; b.y = -5000; } } },
  get penInfo(){ return penInfo; },
  get breakLog(){ return breakLog; },
  get breakTiming(){ return breakTiming; },
  get sounds(){ return { ...sfx, ctx: actx ? actx.state : 'none', muted }; },
  // GPU cost: full frames forced to finish, ms each
  renderTime(n = 20, skip = 0){ skipPass = skip; const px = new Uint8Array(4); render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); const t0 = performance.now(); for (let i = 0; i < n; i++){ render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } skipPass = 0; return (performance.now() - t0) / n; },
  // CPU ms per frame over the last few seconds of real frames: physics/particles, and render submission
  cpuTime(){
    const pick = (i) => { const a = cpuLog.map(r => r[i]).sort((p, q) => p - q); return a.length ? { med: +a[a.length >> 1].toFixed(3), p95: +a[Math.floor(a.length * 0.95)].toFixed(3), max: +a[a.length - 1].toFixed(3) } : null; };
    return { frames: cpuLog.length, update: pick(0), render: pick(1), pieces: bodies.length };
  },
  // GPU ms per rendered frame via EXT_disjoint_timer_query_webgl2; null where the extension is missing
  gpuTime(frames = 60, skip = 0){
    if (!timerExt) return Promise.resolve(null);
    gpuQueries = { pending: [], ms: [] };
    skipPass = skip;
    return new Promise(res => {
      let n = 0;
      const tick = () => {
        dirty = true;
        if (++n < frames + 20) requestAnimationFrame(tick);
        else { pollGpu(); skipPass = 0; const a = gpuQueries.ms.sort((p, q) => p - q); gpuQueries = null; res(a.length ? { n: a.length, med: +a[a.length >> 1].toFixed(3), p95: +a[Math.floor(a.length * 0.95)].toFixed(3) } : null); }
      };
      requestAnimationFrame(tick);
    });
  },
  // mean display luminance (0..1) of the pixels inside the carved letters, deeper than half the cut
  grooveLum(){
    render();
    const col = new Uint8Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, col);
    gl.bindFramebuffer(gl.FRAMEBUFFER, gFb);
    gl.readBuffer(gl.COLOR_ATTACHMENT1);
    const g1 = new Float32Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, g1);
    gl.readBuffer(gl.COLOR_ATTACHMENT0);
    const g0 = new Float32Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, g0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let s = 0, n = 0;
    for (let i = 0; i < W * H; i++){
      if (g0[i * 4 + 3] < 0 || (g0[i * 4 + 3] % 2) > 0.5 || g1[i * 4 + 1] < 0.5) continue;
      s += (0.2126 * col[i * 4] + 0.7152 * col[i * 4 + 1] + 0.0722 * col[i * 4 + 2]) / 255; n++;
    }
    return { lum: n ? s / n : 0, px: n };
  },
  get grabList(){ return [...grabs.values()].map(g => { const [rx, ry] = grabPoint(g); return { id: g.id, body: g.body.id, ax: g.body.x + rx, ay: g.body.y + ry, tx: g.tx, ty: g.ty }; }); },
  contactDump(){ const o = []; for (let i = 0; i < nContacts; i++){ const c = contacts[i]; if (c.ni > 0 || c.maxNi > 0) o.push([c.A ? c.A.id : -1, c.B.id, +c.s0.toFixed(2), +c.relVel.toFixed(0), +c.ni.toFixed(0), +c.nx.toFixed(2), +c.ny.toFixed(2)]); } return o; },
  overlap(){
    // exact overlap area estimate between piece pairs by sampling grain centroids of each piece inside the others
    let worst = 0;
    for (const A of bodies) for (const B of bodies){
      if (A === B) continue;
      let n = 0;
      const c = Math.cos(A.a), s = Math.sin(A.a);
      for (const g of A.grains){
        const lx = GR.cx[g] - A.hx, ly = GR.cy[g] - A.hy;
        if (bodyContains(B, A.x + c * lx - s * ly, A.y + s * lx + c * ly)) n++;
      }
      worst = Math.max(worst, n);
    }
    return worst;
  },
  overlapPairs(){
    const out = [];
    for (const A of bodies) for (const B of bodies){
      if (A === B) continue;
      let n = 0;
      const c = Math.cos(A.a), s = Math.sin(A.a);
      for (const g of A.grains){
        const lx = GR.cx[g] - A.hx, ly = GR.cy[g] - A.hy;
        if (bodyContains(B, A.x + c * lx - s * ly, A.y + s * lx + c * ly)) n++;
      }
      if (n) out.push({ A: A.id, B: B.id, n, aA: Math.round(A.area), aB: Math.round(B.area), gA: A.grains.length, gB: B.grains.length, x: Math.round(A.x), y: Math.round(A.y), vA: Math.hypot(A.vx, A.vy), vB: Math.hypot(B.vx, B.vy), fam: A.family === B.family });
    }
    return out;
  },
  energy(){ let e = 0; for (const b of bodies) e += 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy) + 0.5 * b.I * b.w * b.w; return e; },
  momentum(){ let x = 0, y = 0; for (const b of bodies){ x += b.mass * b.vx; y += b.mass * b.vy; } return [x, y]; },
  totalArea(){ return bodies.reduce((s, b) => s + b.area, 0); },
};
})();
</script>
